[package]
name = "p3-fib-ref"
version = "0.1.0"
edition = "2021"
publish = false

# Real upstream Plonky3 (`p3-*`) Fibonacci-AIR STARK prover, pinned to the
# 0.5.3 crates.io release. This is the head-to-head reference for the
# Jasmin-emitted Tier C prover at ../plonky3_prove_fib_tierc_link.jazz.
#
# Field BabyBear, Poseidon2 hash (width 16), Merkle-tree MMCS, TwoAdicFriPcs.
# The prover body is the canonical p3-uni-stark `prove`, exercised on the
# Fibonacci AIR taken verbatim from the p3-uni-stark 0.5.3 `tests/fib_air.rs`.
#
# FRI parameters are matched to the emitted prover's circuit:
#   height = 8 (1<<3), log_blowup = 2 (blowup x4), num_queries = 8.

[dependencies]
p3-air = "=0.5.3"
p3-baby-bear = "=0.5.3"
p3-challenger = "=0.5.3"
p3-commit = "=0.5.3"
p3-dft = "=0.5.3"
p3-field = "=0.5.3"
p3-fri = "=0.5.3"
p3-matrix = "=0.5.3"
p3-merkle-tree = "=0.5.3"
p3-symmetric = "=0.5.3"
p3-uni-stark = "=0.5.3"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[[bin]]
name = "p3-fib-ref"
path = "src/main.rs"

[[bin]]
name = "p3-fib-interop"
path = "src/interop.rs"

# TASK #647 items 1-3: stage-by-stage dump of prove()'s intermediates (self-checked
# against the real prove() bytes) + REAL-verifier check of a foreign proof file.
[[bin]]
name = "p3-fib-dump"
path = "src/interop_dump.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
