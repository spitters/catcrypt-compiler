name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The heavy jobs run on demand and on pull requests; a push to the default
  # branch runs only the cheap gates (see each job's `if`). There is no schedule:
  # a weekly cold build costs about 2 h of runner time. Start the heavy jobs
  # with workflow_dispatch at a milestone.
# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates. Each is its own step so a failure names itself, and the whole
  # job runs in seconds without a toolchain — so a claim breaks here rather than
  # ninety minutes into the Lean build.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Markdown file links resolve
        if: ${{ !cancelled() }}
        run: bash scripts/check-doc-links.sh

      - name: The lakefile's module list is fresh
        if: ${{ !cancelled() }}
        # The library names its modules one by one (Lake resolves imports by
        # library glob, dependencies first, with no file check; a `CatCrypt.*`
        # glob here would claim every module of a package that requires this one).
        run: bash scripts/gen-module-globs.sh --check

      - name: No module outside the CI-only list imports one inside it
        if: ${{ !cancelled() }}
        run: bash scripts/ci-only-import-gate.sh

      - name: Build roots cover every compiler module (rot guard)
        if: ${{ !cancelled() }}
        run: bash scripts/rot-guard-build.sh --check

      - name: No new hand-authored emit kernel (Com/Lcmd provenance)
        if: ${{ !cancelled() }}
        run: bash scripts/handcom-provenance-ratchet.sh

      - name: No new direct rolled-loop combinator call site (FrontRoutePlan dispatch)
        if: ${{ !cancelled() }}
        run: bash scripts/front-callsite-ratchet.sh

      - name: No new untagged hand-JInstr block; ascent blocks generated, imported or recorded (emit provenance)
        if: ${{ !cancelled() }}
        run: bash scripts/audit_emit_provenance.sh

      - name: No new emitted kernel without a constant-time obligation
        if: ${{ !cancelled() }}
        run: bash scripts/emit-ct-obligation-ratchet.sh

      - name: No new vacuous or assumption-shaped security theorem
        if: ${{ !cancelled() }}
        run: bash scripts/vacuous-theorem-ratchet.sh

      - name: Ascent results tied to a descent theorem or the encoded bytes
        if: ${{ !cancelled() }}
        run: bash scripts/ascent-anchor-ratchet.sh

      - name: Ascent state relations and guards have a satisfiability witness
        if: ${{ !cancelled() }}
        run: bash scripts/ascent-nonvacuity-ratchet.sh

      - name: Every Dialect classified (lowers, theory, test)
        if: ${{ !cancelled() }}
        run: bash scripts/dialect-lowering-ratchet.sh

      - name: No catch-all arm in a leak-kind function
        if: ${{ !cancelled() }}
        run: bash scripts/leak-kind-wildcard-lint.sh

      - name: No new maxHeartbeats bump
        if: ${{ !cancelled() }}
        run: bash scripts/proof-cost-ratchet.sh

      - name: No new known-answer test inside Lean
        if: ${{ !cancelled() }}
        run: bash scripts/lean-kat-ratchet.sh

      - name: Authority documents are free of changelog prose
        if: ${{ !cancelled() }}
        run: bash scripts/lint-lean-prose.sh --docs

      - name: Added Lean files carry clean prose and a Main results section
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -z "$base" ]; then echo "no base commit; nothing added to check"; exit 0; fi
          added="$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.lean' || true)"
          if [ -z "$added" ]; then echo "no added Lean files"; exit 0; fi
          echo "$added"
          # shellcheck disable=SC2086
          bash scripts/lint-lean-prose.sh $added
          # shellcheck disable=SC2086
          bash scripts/module-doc-ratchet.sh $added

      - name: No new proof-cost anti-pattern in changed modules (build-cost static lint)
        # Static half only (no toolchain): a new native_decide in a reflection/emit
        # front module, or a new maxRecDepth/maxHeartbeats budget on a proof, in a
        # module changed since the branch base.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -z "$base" ]; then echo "no base commit; nothing changed to check"; exit 0; fi
          changed="$(git diff --name-only --diff-filter=ACM "$base" HEAD -- 'CatCrypt/**/*.lean' || true)"
          if [ -z "$changed" ]; then echo "no changed CatCrypt modules"; exit 0; fi
          mods="$(printf '%s\n' "$changed" | sed 's/\.lean$//' | tr '/' '.')"
          echo "$mods"
          # shellcheck disable=SC2086
          BUILD_COST_STATIC_ONLY=1 BUILD_COST_BASE="$base" bash scripts/check-build-cost.sh $mods

      - name: Ratchet baselines were not left rewritten
        # Every ratchet above auto-tightens its baseline when the count falls.
        # A tightened baseline that was not committed means the run measured
        # something the repository does not record.
        run: git diff --exit-code -- scripts/

  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The full library on a 16 GB runner: long, but bounded. A run that has not
    # finished by here is stuck, not slow.
    timeout-minutes: 240
    env:
      # Peak memory scales with the number of concurrent Lean workers. Lake has no
      # scheduler of its own — it registers build jobs as Lean tasks, and the Lean
      # runtime's task pool decides how many run at once. This variable sizes that
      # pool, and being an environment variable it is inherited by every child
      # `lean` process, so it bounds worker count and per-process threads together.
      # Left unset the pool is sized from the runner's CPU count and the heavy
      # native_decide modules in the tail exceed the runner's memory. At 1 the build
      # runs ~3 concurrent workers, measured at ~8 GB peak.
      LEAN_NUM_THREADS: "1"
      # The wall-clock budgets of `#kat` checks are set on a development machine; the
      # runner is slower, so CI multiplies them (the heartbeat budgets are unscaled).
      CATCRYPT_KAT_MS_SCALE: "4"
    steps:
      - uses: actions/checkout@v4

      # The mathlib cache, the package build cache, and the build outputs
      # together exceed the runner OS volume's ~14 GB headroom; exhausting it
      # kills the VM without logs. Dropping the preinstalled toolchains the
      # job never uses reclaims ~25 GB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - name: Install elan + the pinned Lean toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The Veir dependency spitters/veir-catcrypt is a public repository that
      # Lake clones over https without credentials, so this key step and the
      # ssh URL rewrite in it are unnecessary; VEIR_DEPLOY_KEY is a read-only
      # deploy key on that repository.
      - name: SSH key for the private Veir dependency
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VEIR_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # lakefile.lean requires Veir by its https URL; this rewrite sends
          # that one URL over ssh, where the deploy key applies.
          git config --global \
            url."git@github.com:spitters/veir-catcrypt".insteadOf \
            "https://github.com/spitters/veir-catcrypt"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch prebuilt mathlib cache
        run: lake exe cache get

      # The package and its non-mathlib deps rebuild from source; on a 16 GB
      # runner a cold full build can exceed the VM. The cache ratchets progress
      # across runs: restore the newest entry for this toolchain, save whatever
      # this run built (also on failure), and let the completeness step below be
      # the pass/fail signal. The build step itself is time-bounded so the VM
      # survives to the save step instead of dying mid-elaboration.
      - name: Restore the package build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/catcryptCore/.lake/build
            .lake/packages/hax-lean/.lake/build
            .lake/packages/paramTransfer/.lake/build
            .lake/packages/Veir/.lake/build
            .lake/packages/CompPoly/.lake/build
            .lake/packages/nominalLean/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ github.run_id }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-

      - name: The ed25519 part-check statements hold
        # Evaluates the statements of the ed25519 part checks, whose kernel proofs
        # cost gigabytes each and sit late in the build. It needs only the symbolic
        # executor, the models and the part maps, so it runs before the full build
        # and reports a statement that a re-imported block has made false even when
        # the run ends before the build reaches the modules holding the checks.
        run: bash scripts/ed25519-part-check-gate.sh

      - name: Build the compiler
        # Every module in scripts/rot-guard/build-roots.txt, 64 per lake invocation.
        # The import closure of that manifest is the whole library, so this builds
        # the same module set as `lake build`, and each module is elaborated under
        # the package's `-E hasSorry`. What the batching buys is attribution: a
        # batch that dies names the modules it was building, and the workers of the
        # preceding batches have exited, so the log locates a failure instead of
        # ending at an anonymous kill partway through one job. The time bound keeps
        # the VM alive for the cache save; an early stop is not a failure here —
        # the completeness step is the verdict.
        # The memory guard stops the lean workers before the VM is out of
        # memory: a hard VM death skips the cache save and pins every later
        # run to the same module, while a stopped batch fails gracefully, the
        # save runs, and the next run resumes at the guard point with a warm
        # cache and full free memory.
        run: |
          ( n=0; while sleep 3; do
              avail=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
              dfree=$(df -m --output=avail / | tail -1 | tr -d ' ')
              n=$((n+1)); [ $((n % 40)) -eq 0 ] && echo "heartbeat: mem=${avail}M disk=${dfree}M"
              if [ "$avail" -lt 3000 ] || [ "$dfree" -lt 2000 ]; then
                echo "guard: mem=${avail}M disk=${dfree}M - stopping lean workers to keep the cache save alive"
                pkill -f 'bin/lean' || true
              fi
            done ) &
          GUARD=$!
          timeout 60m bash scripts/rot-guard-build.sh --build 64 \
            || echo "build stopped early (rc=$?); progress is kept by the cache save"
          kill "$GUARD" 2>/dev/null || true

      - name: Save the package build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/catcryptCore/.lake/build
            .lake/packages/hax-lean/.lake/build
            .lake/packages/paramTransfer/.lake/build
            .lake/packages/Veir/.lake/build
            .lake/packages/CompPoly/.lake/build
            .lake/packages/nominalLean/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ github.run_id }}

      - name: Confirm both libraries are complete
        # Nothing left to elaborate after the step above; this checks that the
        # package's two libraries — the default target `CatCryptCompiler` and
        # the examples library `CatCryptCompilerExamples` — are what the batched
        # build covered.
        run: lake build CatCryptCompiler CatCryptCompilerExamples

      - name: Reproduce the axiom ledger
        run: lake env lean AxiomAudit.lean
